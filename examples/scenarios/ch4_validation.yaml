# Chapter 4 testbed validation: four devices, AlexNet, partitioned inference
# under RR and SJF with 50 repetitions, background load emulating the
# simulator's backlogged processes.
name: ch4_validation
description: Four-device AlexNet validation with partitioned inference (Chapter 4, Table dnn-testbed-delay).
pipeline: experiment
model: alexnet
devices: [device1, device2, device3, device4]
repetitions: 5
warmup: 2
seed: 2024
edge_server:
  policy: SJF
  nominal_frequency: true
  profile_capacity: true
inference:
  enabled: true
  partition_points: [0, 2, 4, 8, 11]
  repetitions: 50
load:
  device2: {mode: processes, processes: 1}
  device3: {mode: processes, processes: 2}
  device4: {mode: processes, processes: 3}
monitoring:
  enabled: true
  throughput: true
optimisation:
  enabled: true
  algorithm: greedy
  objective: total_delay
  transmission_mode: size_over_rate
sweep:
  path: edge_server.policy
  values: [RR, SJF]
