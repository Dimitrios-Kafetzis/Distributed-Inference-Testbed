# Testbed NTP server. The devices synchronise to the edge server only; the edge
# server keeps the distribution's upstream sources when it has internet access and
# otherwise serves its own clock (stratum 8), which keeps the devices mutually
# aligned, which is what the per-device trace alignment needs.
allow 192.168.0.0/24
allow 10.0.0.0/24
local stratum 8
