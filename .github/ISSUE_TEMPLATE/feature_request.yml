name: Feature request
description: Propose a new capability or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you want to do with the testbed that is not possible or is cumbersome today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How the testbed could support it; name the component (scenario field, device-side tool, NNPM dialog, provisioning step).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: hardware
    attributes:
      label: Verification
      options:
        - label: I can verify the change on a physical testbed.
